; Arduino Nano (ATmega328P, old bootloader)
; Windows: set upload_port / monitor_port to COMx (e.g. COM3), or pick in IDE.
; macOS example: /dev/cu.usbserial-XXXX
[env:nanoatmega328]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
; upload_port = COM3
; monitor_port = COM3

lib_deps =
    olikraus/U8g2@^2.35.19

; New bootloader Nano (if Old Bootloader upload fails)
[env:nanoatmega328new]
platform = atmelavr
board = nanoatmega328new
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@^2.35.19

; ---------------------------------------------------------------
; Field test panel: 2.42" SSD1309 128x64 SPI module (7 pin)
;   pio run -e nanoatmega328_ssd1309        ; column offset 0 (usual)
;   pio run -e nanoatmega328_ssd1309_v2     ; column offset 2 (if the image is shifted)
; Same wiring as the SSD1322 panel (CS=D9, DC=D4, RES=D6, SCK=D5, SDA=D3).
; Page buffer (128 B) — the 1 KB full buffer starved the stack and the panel
; showed garbage, so this uses the same firstPage/nextPage path as production.
; ---------------------------------------------------------------
[env:nanoatmega328_ssd1309]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_flags = -DDISPLAY_SSD1309_128X64=1
lib_deps =
    olikraus/U8g2@^2.35.19

[env:nanoatmega328_ssd1309_v2]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_flags =
    -DDISPLAY_SSD1309_128X64=1
    -DSSD1309_VARIANT=2
lib_deps =
    olikraus/U8g2@^2.35.19

; ---------------------------------------------------------------
; One-shot field diagnosis for the production panel (SSD1322 256x64).
; 3 rotating screens: geometry / print-path / live values, plus free RAM.
;   pio run -e nanoatmega328_diag -t upload --upload-port COM3
; ---------------------------------------------------------------
[env:nanoatmega328_diag]
platform = atmelavr
board = nanoatmega328
framework = arduino
monitor_speed = 115200
build_flags = -DDIAG_FIRMWARE=1
lib_deps =
    olikraus/U8g2@^2.35.19
